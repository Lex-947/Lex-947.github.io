name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm' # This safely caches dependencies, not the build

      - name: Install dependencies
        run: npm ci # Ensures a clean, reproducible installation

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Double check your vite config output directory! 
          # Vite outputs to "dist" by default.
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
